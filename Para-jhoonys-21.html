<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para jhoonys - Me Gustas</title>
<style>
html,body{margin:0;height:100%;font-family:Georgia,serif}body{background:linear-gradient(135deg,#ff0080,#800040,#10000a);display:flex;align-items:center;justify-content:center;overflow:hidden}
.c{position:absolute;color:pink;font-size:40px;animation:f 5s infinite}.a{left:10%;top:15%}.b{left:80%;top:20%}.d{left:20%;top:75%}.e{left:85%;top:75%}@keyframes f{50%{transform:translateY(-30px)}}
.card{width:78%;max-width:600px;min-height:420px;background:white;border-radius:40px;text-align:center;padding:40px;box-shadow:0 0 40px pink;z-index:2}
h1{font-size:38px;color:#7d183f;font-style:italic;margin-bottom:45px}.heart{width:180px;height:180px;border:4px solid #d92b68;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:90px;color:#d92b68;cursor:pointer}.heart:active{transform:scale(1.08)}
.msg{margin-top:30px;color:#777;font-style:italic}.final{display:none;margin-top:25px;font-size:22px;color:#d92b68}
</style>
<div class="c a">♥</div><div class="c b">♥</div><div class="c d">♥</div><div class="c e">♥</div>
<div class="card"><h1>Para jhoonys - Me Gustas</h1><div class="heart" onclick="document.querySelector('.final').style.display='block'">♥</div>
<div class="msg">Toca el corazon...</div><div class="final">❤ Quiero decirte que me gustas mucho y quiero demostrarte esto de forma bonita y aprovechando lo que he visto en la uni... ❤<br><br>Y queria que lo supieras.</div></div>
